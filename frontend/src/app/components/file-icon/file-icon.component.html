@switch (category()) {
  @case ('folder') {
    <svg [class]="sizeClass() + ' ' + colorClass() + ' ' + customClass()" viewBox="0 0 24 24" fill="currentColor">
      <path d="M3 6a2 2 0 0 1 2-2h4.17a2 2 0 0 1 1.42.59L12 6h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    </svg>
  }
  @case ('audio') {
    <!-- Music note icon for audio -->
    <svg [class]="sizeClass() + ' ' + colorClass() + ' ' + customClass()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3" fill="currentColor" fill-opacity="0.2"/>
      <circle cx="18" cy="16" r="3" fill="currentColor" fill-opacity="0.2"/>
    </svg>
  }
  @case ('video') {
    <!-- Video camera / player icon for video files -->
    <svg [class]="sizeClass() + ' ' + colorClass() + ' ' + customClass()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="5" width="15" height="14" rx="2" fill="currentColor" fill-opacity="0.1"/>
      <polygon points="8 9 13 12 8 15" fill="currentColor"/>
      <path d="m17 10 5-3v10l-5-3"/>
    </svg>
  }
  @case ('pdf') {
    <!-- PDF document icon with distinct PDF badge -->
    <svg [class]="sizeClass() + ' ' + colorClass() + ' ' + customClass()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="currentColor" fill-opacity="0.1"/>
      <polyline points="14 2 14 8 20 8"/>
      <path d="M8 15v-4h2a1.5 1.5 0 0 1 0 3H8"/>
      <path d="M13 11v4"/>
      <path d="M13 11h2a2 2 0 0 1 0 4h-2"/>
    </svg>
  }
  @case ('markdown') {
    <!-- Markdown distinct document icon -->
    <svg [class]="sizeClass() + ' ' + colorClass() + ' ' + customClass()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="currentColor" fill-opacity="0.1"/>
      <polyline points="14 2 14 8 20 8"/>
      <path d="M7 16v-4l2 2.5 2-2.5v4"/>
      <path d="M15 13v3m0 0-1.5-1.5m1.5 1.5 1.5-1.5"/>
    </svg>
  }
  @case ('text') {
    <!-- Plain text lines document icon -->
    <svg [class]="sizeClass() + ' ' + colorClass() + ' ' + customClass()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="currentColor" fill-opacity="0.1"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="8" y1="13" x2="16" y2="13"/>
      <line x1="8" y1="17" x2="13" y2="17"/>
      <line x1="8" y1="9" x2="10" y2="9"/>
    </svg>
  }
  @case ('code') {
    <!-- Code brackets document icon -->
    <svg [class]="sizeClass() + ' ' + colorClass() + ' ' + customClass()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="currentColor" fill-opacity="0.1"/>
      <polyline points="14 2 14 8 20 8"/>
      <polyline points="9 13 7 15 9 17"/>
      <polyline points="13 13 15 15 13 17"/>
      <line x1="12" y1="12" x2="10" y2="18"/>
    </svg>
  }
  @case ('image') {
    <!-- Image landscape icon -->
    <svg [class]="sizeClass() + ' ' + colorClass() + ' ' + customClass()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="18" x="3" y="3" rx="2" ry="2" fill="currentColor" fill-opacity="0.1"/>
      <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
  }
  @case ('spreadsheet') {
    <!-- Spreadsheet / table grid icon -->
    <svg [class]="sizeClass() + ' ' + colorClass() + ' ' + customClass()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="currentColor" fill-opacity="0.1"/>
      <polyline points="14 2 14 8 20 8"/>
      <path d="M8 12h8"/>
      <path d="M8 16h8"/>
      <path d="M12 12v8"/>
    </svg>
  }
  @case ('presentation') {
    <!-- Presentation board / slide icon -->
    <svg [class]="sizeClass() + ' ' + colorClass() + ' ' + customClass()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 3h20"/>
      <path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3" fill="currentColor" fill-opacity="0.1"/>
      <path d="m7 21 5-5 5 5"/>
    </svg>
  }
  @case ('archive') {
    <!-- Archive package / zip icon -->
    <svg [class]="sizeClass() + ' ' + colorClass() + ' ' + customClass()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" fill="currentColor" fill-opacity="0.1"/>
      <path d="m3.3 7 8.7 5 8.7-5"/>
      <path d="M12 22V12"/>
    </svg>
  }
  @case ('document') {
    <!-- Rich text / Word doc icon -->
    <svg [class]="sizeClass() + ' ' + colorClass() + ' ' + customClass()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="currentColor" fill-opacity="0.1"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <line x1="10" y1="9" x2="8" y2="9"/>
    </svg>
  }
  @default {
    <!-- Generic clean document icon -->
    <svg [class]="sizeClass() + ' ' + colorClass() + ' ' + customClass()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="currentColor" fill-opacity="0.1"/>
      <polyline points="14 2 14 8 20 8"/>
    </svg>
  }
}
