# LAN / tailnet: Angular app + full API
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # No upload size limit; stream bodies straight to the API instead of buffering them on disk
    client_max_body_size 0;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward Tailscale Identity context headers from Tailscale Serve proxy
        proxy_set_header Tailscale-User-Login $http_tailscale_user_login;
        proxy_set_header Tailscale-User-Name $http_tailscale_user_name;
        proxy_set_header Tailscale-User-Profile-Pic $http_tailscale_user_profile_pic;

        # Support streaming media and range requests for client-side previews (video/audio/pdf)
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Public (Tailscale Funnel): only shared-link downloads are reachable
server {
    listen 8080;
    server_name localhost;

    location /api/shared/ {
        limit_except GET { deny all; }
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        return 404;
    }
}
